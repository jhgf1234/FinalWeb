<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>회원가입 | 다시책방</title><link rel="stylesheet" href="sub.css"></head><body>
<div id="hd"></div>
<main class="wrap"><div class="box auth">
<h1>회원가입</h1><p class="sub">가입하면 1,000원 쿠폰을 바로 드려요.</p>
<form id="f" novalidate>
<label for="nm">이름(닉네임)</label><input id="nm" type="text" autocomplete="nickname">
<label for="em">이메일</label><input id="em" type="email" autocomplete="email" placeholder="hello@example.com">
<label for="pw">비밀번호 <small style="font-weight:400">(8자 이상)</small></label><input id="pw" type="password" autocomplete="new-password">
<label for="pw2">비밀번호 확인</label><input id="pw2" type="password" autocomplete="new-password">
<label class="chk"><input type="checkbox" id="ag"><span>이용약관과 개인정보처리방침에 동의합니다. (필수)</span></label>
<div class="err" id="err" role="alert"></div>
<button class="btn">가입하기</button></form>
<p class="swap">이미 회원이신가요? <a href="login.html">로그인</a></p>
</div></main>
<footer>© 2026 DASI CHAEKBANG · <a href="index.html">메인으로</a></footer>
<script src="site.js"></script>
<script>
f.onsubmit=e=>{e.preventDefault();
 const n=nm.value.trim(),m=em.value.trim();let s='';
 if(!n)s='이름을 입력해 주세요.';
 else if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(m))s='올바른 이메일 형식이 아니에요.';
 else if(pw.value.length<8)s='비밀번호는 8자 이상이어야 해요.';
 else if(pw.value!==pw2.value)s='비밀번호가 서로 달라요.';
 else if(!ag.checked)s='약관에 동의해 주세요.';
 else s=DASI.user.join({name:n,email:m,pw:pw.value});
 err.textContent=s;if(s)return;
 DASI.toast('가입 완료! 로그인해 주세요.');setTimeout(()=>location.href='login.html',900)};
</script></body></html>
