<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>로그인 | 다시책방</title><link rel="stylesheet" href="sub.css"></head><body>
<div id="hd"></div>
<main class="wrap"><div class="box auth">
<h1>다시 만나서 반가워요</h1><p class="sub">이메일과 비밀번호로 로그인하세요.</p>
<form id="f" novalidate>
<label for="em">이메일</label><input id="em" type="email" autocomplete="email" placeholder="hello@example.com">
<label for="pw">비밀번호</label><input id="pw" type="password" autocomplete="current-password">
<div class="err" id="err" role="alert"></div>
<button class="btn">로그인</button></form>
<p class="swap">아직 회원이 아니신가요? <a href="join.html">회원가입</a></p>
</div></main>
<footer>© 2026 DASI CHAEKBANG · <a href="index.html">메인으로</a></footer>
<script src="site.js"></script>
<script>
f.onsubmit=e=>{e.preventDefault();
 if(!em.value||!pw.value){err.textContent='이메일과 비밀번호를 모두 입력해 주세요.';return}
 const m=DASI.user.login(em.value.trim(),pw.value);
 if(m){err.textContent=m;return}
 location.href=new URLSearchParams(location.search).get('next')||'index.html'};
</script></body></html>
